<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>命理分析 · 多模块</title>
<style>
  :root{--bg:#f6f3ec;--card:#fffdf8;--ink:#2b2620;--ink2:#6b6257;--line:#e4dccd;--red:#b23a2e;--gold:#a8853f;--green:#3f6b52;--blue:#3a5a7a;--shadow:0 6px 24px rgba(60,45,25,.08)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.7;font-size:15px}
  .wrap{max-width:880px;margin:0 auto;padding:18px 14px 90px}
  header{text-align:center;padding:14px 0 8px}
  header h1{margin:0;font-size:22px;letter-spacing:4px;font-weight:600}
  header h1 span{color:var(--red)}
  header p{margin:6px 0 0;color:var(--ink2);font-size:12px;letter-spacing:1px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;position:sticky;top:0;background:var(--bg);z-index:20;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:.18s}
  .tabs button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
  .drop{border:2px dashed #d6c9b0;border-radius:12px;padding:28px 14px;text-align:center;cursor:pointer;transition:.2s;background:linear-gradient(180deg,#fffdf8,#faf5ea)}
  .drop:hover,.drop.over{border-color:var(--gold);background:#fdf7ea}
  .drop .big{font-size:14px;font-weight:600;margin-bottom:4px}
  .drop .sub{color:var(--ink2);font-size:12px}
  #previewBox{display:none;margin-top:12px;text-align:center}
  #previewBox img{max-width:100%;max-height:280px;border-radius:10px;border:1px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button.act{cursor:pointer;border:none;border-radius:10px;padding:11px 20px;font:inherit;transition:.18s}
  .primary{background:var(--red);color:#fff;flex:1;min-width:140px;font-weight:600}
  .primary:disabled{background:#cbb9b4;cursor:not-allowed}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .ghost:hover{border-color:var(--gold);color:var(--ink)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
  .fields label{font-size:12px;color:var(--ink2);display:block;margin-bottom:4px}
  .fields input,.fields select,.fields textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
  .fields textarea{min-height:74px;resize:vertical}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
  .chip.on{background:#f6ecd8;border-color:var(--gold);color:#7a5c26;font-weight:600}
  .status{margin-top:10px;font-size:12px;color:var(--ink2);min-height:18px}
  .status .step{display:flex;align-items:center;gap:7px;margin:3px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:#d8cfc0;flex:0 0 auto}
  .dot.on{background:var(--gold);box-shadow:0 0 0 3px rgba(168,133,63,.18)}
  .dot.ok{background:var(--green)}
  .dot.err{background:var(--red)}
  h2{font-size:16px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px;display:inline-block}
  h3{font-size:14px;margin:14px 0 6px}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .badge{background:#f3ecdd;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--ink2)}
  .badge b{color:var(--red);font-weight:600}
  table.chart{width:100%;border-collapse:collapse;font-size:12px}
  table.chart td,table.chart th{padding:7px 5px;text-align:center;border-bottom:1px solid var(--line)}
  table.chart th{color:var(--ink2);font-weight:500;font-size:11px}
  .gan,.zhi{font-size:20px;font-weight:700}
  .mini{font-size:11px;color:var(--ink2);line-height:1.5}
  .wx{display:grid;gap:6px;margin-top:6px}
  .wx .item{display:grid;grid-template-columns:26px 1fr 40px;align-items:center;gap:8px;font-size:12px}
  .bar{height:8px;background:#efe8da;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px}
  .tag{font-size:11px;padding:2px 9px;border-radius:6px;background:#f6efe0;border:1px solid #e8dcc6;color:#7a5c26;margin:2px}
  .tag.chong{background:#fbeeec;border-color:#f0cfc9;color:#a33b30}
  .tag.he{background:#eef4ef;border-color:#cfe0d4;color:#3f6b52}
  .verify{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:13px;margin-bottom:10px;background:#fffdf6}
  .verify .hd{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .verify .no{background:var(--gold);color:#fff;border-radius:6px;font-size:11px;padding:1px 8px;font-weight:600}
  .verify .period{font-weight:600;font-size:13px}
  .verify .age,.verify .domain{font-size:11px;color:var(--ink2);background:#f3ecdd;border-radius:5px;padding:1px 7px}
  .verify .ev{font-size:13px;margin:4px 0}
  .verify .ba{font-size:11px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
  .sec{margin-bottom:12px}
  .sec .lab{font-size:12px;font-weight:600;color:var(--red);margin-bottom:2px}
  .sec .txt{font-size:13px;white-space:pre-wrap}
  table.dy td{padding:6px 4px;font-size:11px;text-align:center;border-bottom:1px solid var(--line)}
  table.dy tr.cur{background:#fdf3e2}
  .issues{border:1px solid #f0cfc9;background:#fdf6f4;border-radius:10px;padding:12px;margin-bottom:9px}
  .issues .p{font-size:13px;font-weight:600;color:#a33b30}
  .issues .r,.issues .f{font-size:12px;color:var(--ink2);margin-top:3px}
  .warn{border:1px solid #f0d9a8;background:#fffaee;border-radius:10px;padding:10px;font-size:12px;color:#8a6a20;margin-bottom:10px}
  .err{color:var(--red);font-size:13px;white-space:pre-wrap}
  .chat{margin-top:12px}
  .msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .msg{max-width:86%;padding:9px 13px;border-radius:12px;font-size:13px;white-space:pre-wrap;line-height:1.65}
  .msg.user{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .chatbar{display:flex;gap:8px}
  .chatbar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;background:#fff}
  .chatbar button{flex:0 0 auto;padding:10px 16px;border-radius:10px;background:var(--red);color:#fff;border:none;font:inherit;font-size:13px;cursor:pointer}
  .foot{text-align:center;color:#9b9184;font-size:11px;margin-top:18px;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2620;color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.show{opacity:.95}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>问 <span>命</span> · 命理分析</h1>
    <p>八字 / 紫微 / 面相 / 手相 / 风水 / 占卜 · 可对话追问</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="panels"></div>

  <div class="foot">
    命理与相术属传统文化推演，结果仅供娱乐与自我观察，不构成任何决策依据。<br>
    本工具在你本机运行，图片只发往模型接口用于识别与分析。
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // 访问口令：公网穿透时网址带 ?t=口令，存起来并自动加到所有 API 请求头
  var TOKEN = (function () {
    try {
      var q = new URLSearchParams(location.search).get('t');
      if (q) { localStorage.setItem('bazi_token', q); return q; }
      return localStorage.getItem('bazi_token') || '';
    } catch (e) { return ''; }
  })();
  (function patchFetch() {
    var _fetch = window.fetch.bind(window);
    window.fetch = function (url, opts) {
      opts = opts || {};
      if (typeof url === 'string' && url.indexOf('/api/') === 0 && TOKEN) {
        opts.headers = Object.assign({}, opts.headers, { 'x-access-token': TOKEN });
      }
      return _fetch(url, opts).then(function (r) {
        if (r.status === 401) toast('需要访问口令：请用完整网址（含 ?t=…）打开本页');
        return r;
      });
    };
  })();
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 1800); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---------------- 模块定义 ----------------
  var MODS = [
    { id: 'bazi', name: '八字', image: true, manual: true, focus: true,
      hint: '上传问真八字等排盘截图（含四柱天干地支）',
      sub: '也可在下方手动填四柱，识别不准时用这个' },
    { id: 'ziwei', name: '紫微斗数', image: true,
      hint: '上传文墨天机/问真紫微命盘截图',
      sub: '需能看清十二宫与主星' },
    { id: 'face', name: '面相', image: true,
      hint: '上传清晰的正面人脸照片',
      sub: '建议光线均匀、无美颜滤镜、正对镜头' },
    { id: 'palm', name: '手相', image: true,
      hint: '上传清晰的手掌照片',
      sub: '掌心平整、纹路清晰、光线充足' },
    { id: 'fengshui', name: '住宅风水', image: true,
      hint: '上传户型平面图或房屋照片',
      sub: '补充朝向与房间信息会更准' },
    { id: 'divination', name: '占卜', image: false,
      hint: '输入你想问的事，程序按当前时间起梅花卦',
      sub: '一事一占，问得越具体越准' },
    { id: 'rectify', name: '生时校正', image: false, skipPanel: true }
  ];

  var FOCUS_LIST = ['事业', '财运', '婚恋', '健康', '子女', '学业'];
  var st = {}; // 每模块状态

  // ---------------- 构建 UI ----------------
  var tabsHtml = MODS.map(function (m, i) {
    return '<button data-tab="' + m.id + '" class="' + (i === 0 ? 'on' : '') + '">' + m.name + '</button>';
  }).join('');
  $('tabs').innerHTML = tabsHtml;

  var panelsHtml = MODS.map(function (m, i) {
    if (m.skipPanel) return '';
    var h = '<section class="panel' + (i === 0 ? '' : ' hidden') + '" id="p-' + m.id + '"><div class="card">';
    if (m.image) {
      h += '<div class="drop" id="drop-' + m.id + '"><div class="big">' + m.hint + '</div><div class="sub">点击 / 拖拽 / Ctrl+V 粘贴</div>' +
           '<input type="file" id="file-' + m.id + '" accept="image/*" hidden></div>' +
           '<div class="previewBox" id="pv-' + m.id + '"><img id="img-' + m.id + '"></div>';
    } else {
      h += '<div class="fields"><div style="grid-column:1/-1"><label>' + m.hint + '</label>' +
           '<textarea id="q-' + m.id + '" placeholder="例如：今年适不适合换工作？下个月面试能否通过？"></textarea></div></div>';
    }
    if (m.manual) {
      h += '<div class="fields" id="manual-' + m.id + '">' +
        '<div><label>年柱</label><input id="mYear" maxlength="2" placeholder="乙亥"></div>' +
        '<div><label>月柱</label><input id="mMonth" maxlength="2" placeholder="己卯"></div>' +
        '<div><label>日柱</label><input id="mDay" maxlength="2" placeholder="甲辰"></div>' +
        '<div><label>时柱</label><input id="mHour" maxlength="2" placeholder="甲戌"></div>' +
        '<div><label>性别</label><select id="mGender"><option value="女">女（坤造）</option><option value="男">男（乾造）</option></select></div>' +
        '<div><label>公历生日</label><input id="mBirth" placeholder="1995-03-14 20:46"></div></div>';
    }
    if (m.id === 'fengshui') {
      h += '<div class="fields">' +
        '<div><label>朝向（坐→向）</label><input id="fsOrient" placeholder="坐北朝南"></div>' +
        '<div><label>楼层</label><input id="fsFloor" placeholder="8/18"></div>' +
        '<div><label>屋主生年</label><input id="fsYear" placeholder="1995"></div>' +
        '<div><label>入户门方位</label><input id="fsDoor" placeholder="东/东南"></div>' +
        '<div style="grid-column:1/-1"><label>补充说明</label><textarea id="fsExtra" placeholder="如：主卧在西南、厨房在西北、大门直通阳台…"></textarea></div></div>';
    }
    if (m.focus) {
      h += '<div class="chips" id="focus-' + m.id + '">' + FOCUS_LIST.map(function (f) {
        return '<span class="chip" data-f="' + f + '">' + f + '</span>';
      }).join('') + '</div><div class="mini" style="margin-top:6px">可不选；选中则对该专项深入分析</div>';
    }
    h += '<div class="row"><button class="act primary" id="go-' + m.id + '">开始分析</button>' +
         '<button class="act ghost" id="reset-' + m.id + '">重来</button></div>' +
         '<div class="status" id="st-' + m.id + '"></div></div>' +
         '<div id="r-' + m.id + '"></div></section>';
    return h;
  }).join('');
  $('panels').innerHTML = panelsHtml;

  // 选项卡
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    var id = b.getAttribute('data-tab');
    [].forEach.call($('tabs').children, function (x) { x.classList.toggle('on', x === b); });
    MODS.forEach(function (m) { $('p-' + m.id).classList.toggle('hidden', m.id !== id); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------------- 每模块绑定 ----------------
  MODS.forEach(function (m) {
    st[m.id] = { image: null, result: null, chat: [], focus: [] };
    if (m.skipPanel) return;
    var d = $('drop-' + m.id);
    if (d) {
      d.addEventListener('click', function () { $('file-' + m.id).click(); });
      ['dragenter', 'dragover'].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.remove('over'); }); });
      d.addEventListener('drop', function (e) {
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) loadImg(m.id, f);
      });
      $('file-' + m.id).addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) loadImg(m.id, e.target.files[0]);
      });
    }
    if (m.focus) {
      $('focus-' + m.id).addEventListener('click', function (e) {
        var c = e.target.closest('.chip'); if (!c) return;
        c.classList.toggle('on');
        var f = c.getAttribute('data-f');
        var i = st[m.id].focus.indexOf(f);
        if (i >= 0) st[m.id].focus.splice(i, 1); else st[m.id].focus.push(f);
      });
    }
    $('go-' + m.id).addEventListener('click', function () { run(m.id); });
    $('reset-' + m.id).addEventListener('click', function () {
      st[m.id] = { image: null, result: null, chat: [], focus: [] };
      var pv = $('pv-' + m.id); if (pv) pv.style.display = 'none';
      $('r-' + m.id).innerHTML = '';
      setStatus(m.id, null);
      if (m.manual) ['mYear', 'mMonth', 'mDay', 'mHour', 'mBirth'].forEach(function (id) { var el = $(id); if (el) el.value = ''; });
      if (m.id === 'divination') $('q-' + m.id).value = '';
      if (m.focus) [].forEach.call($('focus-' + m.id).children, function (c) { c.classList.remove('on'); });
    });
  });

  // 全局粘贴：粘到当前可见模块
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { loadImg(activeMod(), f); toast('已粘贴截图'); }
        return;
      }
    }
  });
  function activeMod() {
    var el = document.querySelector('.panel:not(.hidden)');
    return el ? el.id.replace('p-', '') : 'bazi';
  }

  function loadImg(id, f) {
    if (!f.type || f.type.indexOf('image/') !== 0) { toast('请选择图片'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      st[id].image = fr.result;
      var pv = $('pv-' + id), img = $('img-' + id);
      if (img) img.src = fr.result;
      if (pv) pv.style.display = 'block';
      setStatus(id, [['已选择图片，点「开始分析」', 'ok']]);
    };
    fr.readAsDataURL(f);
  }

  function compress(dataUrl, maxW) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, (maxW || 1200) / img.naturalWidth);
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * scale);
        cv.height = Math.round(img.naturalHeight * scale);
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.86));
      };
      img.src = dataUrl;
    });
  }

  function setStatus(id, steps) {
    var el = $('st-' + id); if (!el) return;
    if (!steps) { el.innerHTML = ''; return; }
    el.innerHTML = steps.map(function (s) {
      return '<div class="step"><span class="dot ' + (s[1] || '') + '"></span><span>' + esc(s[0]) + '</span></div>';
    }).join('');
  }

  function busy(id, on) {
    var b = $('go-' + id); if (b) { b.disabled = on; b.textContent = on ? '分析中…' : '开始分析'; }
  }

  // 提交异步任务并轮询结果（云平台请求有超时，长任务必须走这个）
  function jobRun(url, payload, onTick) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || '提交失败');
      if (!j.jobId) return j; // 兼容同步返回
      return new Promise(function (resolve, reject) {
        var started = Date.now(), timer = setInterval(function () {
          var elapsed = Math.round((Date.now() - started) / 1000);
          if (onTick) onTick(elapsed);
          if (elapsed > 900) { clearInterval(timer); reject(new Error('任务超时（超过 15 分钟）')); return; }
          fetch('/api/job/' + j.jobId).then(function (r) { return r.json(); }).then(function (s) {
            if (!s.ok) { clearInterval(timer); reject(new Error(s.error || '查询任务失败')); return; }
            if (s.status === 'done') { clearInterval(timer); resolve(s.result); }
            else if (s.status === 'error') { clearInterval(timer); reject(new Error(s.error || '分析失败')); }
          }).catch(function () { /* 单次轮询失败忽略，继续 */ });
        }, 1500);
      });
    });
  }

  // ---------------- 运行 ----------------
  function run(id) {
    var m = MODS.filter(function (x) { return x.id === id; })[0];
    var s = st[id];
    var payload = { module: id, params: {}, focus: s.focus };

    if (id === 'divination') {
      var q = $('q-divination').value.trim();
      if (!q) { toast('请先输入你想问的事'); return; }
      payload.text = q;
    } else if (m.manual) {
      var y = $('mYear').value.trim(), mo = $('mMonth').value.trim(), d = $('mDay').value.trim(), h = $('mHour').value.trim();
      if (y && mo && d && h) {
        payload.chart = { year: y, month: mo, day: d, hour: h };
        payload.gender = $('mGender').value;
        payload.birth = $('mBirth').value.trim();
      }
    }

    if (id === 'fengshui') {
      payload.params = {
        orientation: $('fsOrient').value.trim(),
        floor: $('fsFloor').value.trim(),
        birthYear: $('fsYear').value.trim(),
        door: $('fsDoor').value.trim(),
        extra: $('fsExtra').value.trim()
      };
    }

  function buildContext(j) {
    var o = { module: j.module, analysis: j.analysis };
    if (j.chart) o.chart = j.chart;
    if (j.engine) {
      o.engine = {
        pillars: j.engine.pillars.map(function (p) { return p.cn + p.raw; }),
        dayGan: j.engine.dayGan, geju: j.engine.geju, strength: j.engine.strengthLabel,
        yongshen: j.engine.yongshen.desc, wxPercent: j.engine.wxPercent,
        current: j.engine.current, dayun: j.engine.dayun.slice(0, 6)
      };
    }
    if (j.extracted) o.extracted = j.extracted;
    if (j.gua) o.gua = { ben: j.gua.ben, hu: j.gua.hu, bian: j.gua.bian, ti: j.gua.ti, yong: j.gua.yong, relation: j.gua.relation };
    return JSON.stringify(o).slice(0, 6000);
  }

  function sendChat(id) {
    var inp = $('ci-' + id), q = inp.value.trim();

    var s = st[id];

    inp.value = '';
    s.chat.push({ role: 'user', content: q });
    paintChat(id, '思考中…');
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ module: id, context: buildContext(s.result), messages: s.chat })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || '对话失败');
      s.chat.push({ role: 'assistant', content: j.reply });
      paintChat(id, null);
    }).catch(function (e) {
      s.chat.pop();
      paintChat(id, null);
      toast('失败：' + e.message);
    });
  }

    if (pending) h += '<div class="msg ai">' + esc(pending) + '</div>';

      '<div class="row"><button class="act primary" id="rcGo">开始校正</button><button class="act ghost" id="rcReset">重来</button></div>' +
      '<div class="status" id="st-rectify"></div>' +
    '</div><div id="r-rectify"></div></section>');

  function rcPaintChips() {
    $('rcChips').innerHTML = DIZHI.map(function (z) {
      return '<span class="chip' + (RC.candidates.indexOf(z) >= 0 ? ' on' : '') + '" data-z="' + z + '">' + z + '</span>';
    }).join('');
  }
  function rcPaintEvents() {
    var types = RC.types.length ? RC.types : ['婚姻/恋爱', '生育/添丁', '工作/升职', '学业/考试', '财运/置业', '搬迁/远行', '破财/负债', '疾病/受伤', '亲人离世', '官非/纠纷', '感情不顺/分手'];
    $('rcEvents').innerHTML = RC.events.map(function (ev, i) {
      var opts = types.map(function (t) { return '<option' + (t === ev.type ? ' selected' : '') + '>' + t + '</option>'; }).join('');
      return '<div class="fields" data-i="' + i + '" style="border-top:1px dashed var(--line);padding-top:8px;margin-top:4px">' +
        '<div><label>年份</label><input class="evYear" maxlength="4" placeholder="2018" value="' + esc(ev.year || '') + '"></div>' +
        '<div><label>类型</label><select class="evType">' + opts + '</select></div>' +
        '<div><label>备注（可选）</label><input class="evNote" placeholder="换工作到外地" value="' + esc(ev.note || '') + '"></div>' +
        '<div><label>&nbsp;</label><button class="act ghost evDel" style="width:100%">删除</button></div></div>';
    }).join('');
  }
  rcPaintChips(); rcPaintEvents();

  $('rcChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    var z = c.getAttribute('data-z'), i = RC.candidates.indexOf(z);
    if (i >= 0) { if (RC.candidates.length === 1) { toast('至少保留一个候选时辰'); return; } RC.candidates.splice(i, 1); }
    else RC.candidates.push(z);
    rcPaintChips();
  });
  $('rcEvents').addEventListener('input', function (e) {
    var row = e.target.closest('[data-i]'); if (!row) return;
    var ev = RC.events[Number(row.getAttribute('data-i'))];
    if (e.target.classList.contains('evYear')) ev.year = e.target.value.replace(/\D/g, '');
    if (e.target.classList.contains('evNote')) ev.note = e.target.value;
  });
  $('rcEvents').addEventListener('change', function (e) {
    var row = e.target.closest('[data-i]'); if (!row) return;
    if (e.target.classList.contains('evType')) RC.events[Number(row.getAttribute('data-i'))].type = e.target.value;
  });
  $('rcEvents').addEventListener('click', function (e) {
    if (!e.target.classList.contains('evDel')) return;
    var row = e.target.closest('[data-i]'); if (!row) return;
    if (RC.events.length === 1) { toast('至少保留一条'); return; }
    RC.events.splice(Number(row.getAttribute('data-i')), 1); rcPaintEvents();
  });
  $('rcAdd').addEventListener('click', function () {
    RC.events.push({ year: '', type: RC.types[0] || '婚姻/恋爱', note: '' }); rcPaintEvents();
  });
  $('rcReset').addEventListener('click', function () {
    RC.candidates = DIZHI.slice(); RC.events = [{ year: '', type: '婚姻/恋爱', note: '' }];
    ['rcBirthYear', 'rcYear', 'rcMonth', 'rcDay'].forEach(function (id) { $(id).value = ''; });
    $('r-rectify').innerHTML = ''; setStatus('rectify', null);
    rcPaintChips(); rcPaintEvents();
  });

  $('rcGo').addEventListener('click', function () {
    var year = $('rcYear').value.trim(), month = $('rcMonth').value.trim(), day = $('rcDay').value.trim();
    if (year.length !== 2 || month.length !== 2 || day.length !== 2) { toast('请完整填写年柱/月柱/日柱（各两字）'); return; }
    var birthYear = Number($('rcBirthYear').value.trim());
    if (!birthYear || birthYear < 1900) { toast('请填写四位出生公历年（用于定位大运）'); return; }
    var evs = RC.events.filter(function (e) { return /^\d{4}$/.test(String(e.year).trim()); })
      .map(function (e) { return { year: Number(String(e.year).trim()), type: e.type, note: e.note }; });
    if (!evs.length) { toast('请至少填一条带四位年份的事件'); return; }

    var btn = $('rcGo'); btn.disabled = true; btn.textContent = '校正中…';
    var t0 = Date.now();
    setStatus('rectify', [['① 逐时辰确定性打分…', 'ok'], ['② 联网生成结论（约 1-2 分钟）…', 'on']]);
    jobRun('/api/rectify', { year: year, month: month, day: day, birthYear: birthYear, gender: $('rcGender').value, candidates: RC.candidates.slice(), events: evs },
      function (el) { setStatus('rectify', [['① 打分完成', 'ok'], ['② 模型分析中 ' + el + ' 秒…', 'on']]); })
      .then(function (j) {
      if (!j.ok) throw new Error(j.error || '校正失败');
      if (j.eventTypes) RC.types = j.eventTypes;
      j._secs = ((Date.now() - t0) / 1000).toFixed(1);
      rcRender(j);
      setStatus('rectify', [['校正完成，用时 ' + j._secs + ' 秒', 'ok']]);
    }).catch(function (e) {
      setStatus('rectify', [['失败：' + e.message, 'err']]);
    }).then(function () { btn.disabled = false; btn.textContent = '开始校正'; });
  });

  function rcRender(j) {
    var evCount = j.input.events.length;
    var h = '<div class="card"><h2>时辰排序（确定性打分）</h2>' +
      '<div class="mini" style="margin-bottom:8px">得分来自「该时辰下的流年/大运/喜忌能否解释这些事件」，不是玄学直觉。命中＝该时辰能正向解释的事件数。</div>' +
      '<table class="chart"><tr><th>排名</th><th>时辰</th><th>得分</th><th>命中</th><th>格局/旺衰</th></tr>';
    j.ranking.forEach(function (r) {
      h += '<tr' + (r.rank === 1 ? ' class="cur"' : '') + '><td>' + r.rank + '</td><td><b>' + esc(r.hour) + '</b><br><span class="mini">' + esc(r.zhi) + '时</span></td>' +
        '<td>' + r.score + '</td><td>' + r.hits + '/' + evCount + '</td><td class="mini">' + esc(r.geju) + '<br>' + esc(r.strength) + '</td></tr>';
    });
    h += '</table></div>';

    var c = j.conclusion || {};
    if (c.best) {
      h += '<div class="card"><h2>校正结论</h2>' +
        '<div class="badges"><span class="badge">最可能 <b>' + esc(c.best_hour || c.best) + '</b></span>' +
        '<span class="badge">置信度 <b>' + esc(c.confidence || '—') + '</b></span></div>' +
        '<div class="sec" style="margin-top:10px"><div class="lab">理由</div><div class="txt">' + esc(c.reason) + '</div></div>';
      if (Array.isArray(c.event_match) && c.event_match.length) {
        h += '<h3>事件吻合度</h3>' + c.event_match.map(function (x) {
          return '<div class="sec"><div class="lab">' + esc(x.event) + '　·　' + esc(x.fit) + '</div><div class="txt">' + esc(x.why) + '</div></div>';
        }).join('');
      }
      if (c.daily_check) h += '<div class="sec"><div class="lab">可用来自查的细节</div><div class="txt">' + esc(c.daily_check) + '</div></div>';
      if (c.caveat) h += '<div class="sec"><div class="lab">不确定性与补充建议</div><div class="txt">' + esc(c.caveat) + '</div></div>';
      h += '<div class="row"><button class="act primary" id="rcUse">用「' + esc(c.best_hour || c.best) + '」去分析八字</button></div></div>';
    } else {
      h += '<div class="card"><div class="warn">⚠ 模型结论生成失败：' + esc(c.error || '未知原因') + '。上面的打分排序仍然可用。</div></div>';
    }
    if (c.disclaimer) h += '<div class="foot">' + esc(c.disclaimer) + '</div>';

    $('r-rectify').innerHTML = h;
    var useBtn = $('rcUse');
    if (useBtn) useBtn.addEventListener('click', function () {
      document.querySelector('[data-tab="bazi"]').click();
      $('mYear').value = j.input.year; $('mMonth').value = j.input.month; $('mDay').value = j.input.day;
      $('mHour').value = c.best_hour || (c.best + '');
      $('mGender').value = j.input.gender; $('mBirth').value = '';
      toast('已填入八字模块，点「开始分析」即可');
    });
    $('r-rectify').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 启动自检
  fetch('/api/health').then(function (r) { return r.json(); }).then(function (j) {
    if (!j.visionKeyConfigured || !j.analysisKeyConfigured) {
      setStatus('bazi', [['⚠ 有 API key 未配置，请检查 config.json', 'err']]);
    }
    if (j.eventTypes && j.eventTypes.length && !RC.types.length) { RC.types = j.eventTypes; rcPaintEvents(); }
    // 手机访问提示
    if (j.lanUrls && j.lanUrls.length && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      var el = document.createElement('div');
      el.className = 'mini';
      el.style.cssText = 'text-align:center;margin-top:8px;color:#3f6b52;background:#eef4ef;border:1px solid #cfe0d4;border-radius:8px;padding:6px 10px';
      el.innerHTML = '📱 手机访问（同一 Wi-Fi）：<b>' + j.lanUrls[0] + '</b>';
      document.querySelector('header').appendChild(el);
    }
  }).catch(function () { setStatus('bazi', [['⚠ 后端未启动：请先运行 node server.js', 'err']]); });
})();
</script>
</body>
</html>
